<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HoumaHype App</title>
<meta name="theme-color" content="#081230">
<script src="firebase-config.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Anton&display=swap">
<style>
:root{--bg:#081230;--panel:#0f1d46;--line:rgba(255,255,255,.14);--ink:#fff;--mut:#9fb0d6;--rd:#ff3b4e;--bl:#2f7bff;--yl:#ffd23f;--gn:#35d07f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:radial-gradient(120% 60% at 0% 0%,rgba(255,59,78,.25),transparent 60%),radial-gradient(120% 60% at 100% 10%,rgba(47,123,255,.3),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,.big,.tabs b{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.03em}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.logo{font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.05em}.logo i{font-style:normal;color:var(--yl)}
.live{font-size:11px;font-weight:800;background:var(--rd);padding:4px 10px;border-radius:20px;letter-spacing:.08em;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.55}}
.demo{font-size:11px;color:var(--yl);text-align:center;padding:2px 18px 6px}
main{padding:6px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hero{text-align:center;padding:26px 16px;background:linear-gradient(135deg,rgba(255,59,78,.35),rgba(47,123,255,.4));border:2px solid #fff;box-shadow:6px 6px 0 var(--rd),-6px -6px 0 var(--bl)}
.hero .big{font-size:76px;line-height:1;color:var(--yl)}
.hero small{display:block;color:#fff;opacity:.85;letter-spacing:.12em;font-size:12px;font-weight:800;margin-top:6px}
h2{font-size:22px;margin:18px 2px 6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .n{width:26px;text-align:center;font-family:Anton;color:var(--mut)}
.row .nm{flex:1;font-weight:600}.row .v{font-family:Anton;font-size:18px;color:var(--yl)}
.pl{padding:12px 14px;border-radius:14px;margin:6px 0;background:rgba(255,255,255,.06);border:1px solid var(--line)}.pl.now{border:2px solid var(--yl);background:rgba(255,210,63,.12)}.pl.brk{opacity:.8}.pl .t{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.06em}.pl .s{font-size:18px;font-weight:800}.pl .o{font-size:13px}.pl .g{float:right;font-family:Anton;font-size:18px;color:var(--yl)}
.go{text-align:center;padding:18px 14px;border-radius:18px;margin:8px 0;border:2px solid #fff}.go.play{background:linear-gradient(135deg,#1c8f58,#0e5a38)}.go.move{background:linear-gradient(135deg,#d97a00,#a14d00)}.go.wait{background:linear-gradient(135deg,#34406b,#1c2650)}.go .k{font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.9}.go .b{font-family:Anton;font-size:30px;margin:4px 0}.go .d{font-size:14px}
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin:6px 0;border:2px solid transparent}.lb.m{background:linear-gradient(90deg,#c4162a,#8d0f1e)}.lb.w{background:linear-gradient(90deg,#1f5fe0,#12378f)}.lb.me{border-color:var(--yl)}
.lb .r{width:40px;text-align:center;font-family:Anton;font-size:20px}.lb .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb .v{font-family:Anton;font-size:22px}.lb .c{font-size:11px;opacity:.85;letter-spacing:.08em;font-weight:800}
.medal{display:inline-block;width:34px;height:34px;line-height:34px;border-radius:50%;font-family:Anton;font-size:18px;color:#222;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}.medal.g{background:linear-gradient(135deg,#fff3a0,#f2b800)}.medal.s{background:linear-gradient(135deg,#fff,#aeb7c4)}.medal.b{background:linear-gradient(135deg,#f6c08f,#b9692b)}
.row.me{background:rgba(255,210,63,.12);border-radius:12px;padding:10px 8px;margin:2px -8px}
.pos{color:var(--gn)}.neg{color:var(--rd)}
.bar{height:12px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rd),var(--yl));transition:width .6s}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs .t{border-radius:14px;padding:14px 6px}.vs .t b{display:block;font-family:Anton;font-size:30px}
.mz{background:rgba(255,59,78,.3);border:1px solid var(--rd)}.wz{background:rgba(47,123,255,.3);border:1px solid var(--bl)}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;border:0;background:var(--rd);color:#fff;font-weight:800;font-size:15px;text-decoration:none;box-shadow:4px 4px 0 var(--bl);cursor:pointer}
.btn.alt{background:transparent;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:16px;margin:8px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,18,48,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;color:var(--mut);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;cursor:pointer}
.tabs button span{font-size:22px}.tabs button.on{color:var(--yl)}
.flash{animation:fl .9s}@keyframes fl{0%{background:rgba(255,210,63,.5)}100%{background:transparent}}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.14);margin-right:6px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.badge{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;font-size:13px}.badge.lock{opacity:.35}
.cd{display:flex;gap:8px;justify-content:center;margin:8px 0}.cd div{background:rgba(0,0,0,.3);border-radius:12px;padding:10px 12px;min-width:62px;text-align:center}.cd b{font-family:Anton;font-size:30px;display:block}.cd span{font-size:10px;color:var(--mut);letter-spacing:.1em}
.login{padding:40px 22px;text-align:center}.login h1{font-size:44px;margin:10px 0}
.hidden{display:none!important}.mut{color:var(--mut);font-size:13px}
</style></head><body>

<div id="login" class="login hidden">
  <div class="logo" style="font-size:30px">HOUMA<i>HYPE</i></div>
  <h1>TAP IN.</h1>
  <p class="mut">Tap your wristband on the back of your phone, or type the code printed on it.</p>
  <input id="code" placeholder="Wristband code, e.g. M001" autocapitalize="characters" autocomplete="off">
  <button class="btn" onclick="doLogin(document.getElementById('code').value)">Enter the arena</button>
  <p id="lerr" class="neg" style="min-height:20px"></p>
</div>

<div id="app" class="hidden">
  <div class="top"><div class="logo">HOUMA<i>HYPE</i></div><div class="live" id="livetag">&#9679; LIVE</div></div>
  <div class="demo" id="demonote"></div>
  <main id="view"></main>
  <nav class="tabs">
    <button data-t="barhams"><span>&#129689;</span>Barhams</button>
    <button data-t="plan"><span>&#128197;</span>My Games</button>
    <button data-t="aura"><span>&#9889;</span>Aura Score</button>
    <button data-t="events"><span>&#127942;</span>Events</button>
    <button data-t="profile"><span>&#128100;</span>Profile</button>
  </nav>
</div>

<script>
/* ============ DATA LAYER ============
   The app only talks to `DB`. Right now DB is a DEMO (fake players, simulated live changes).
   To go live, replace DB with an adapter that has the same 4 methods:
     DB.demo            -> false
     DB.get(code)       -> Promise<player|null>   player = {code,nick,team,barhams,aura,tx:[{t,d,ts}]}
     DB.top(n)          -> player[] (top n by aura)   DB.teams() -> {MaZoo,WiSoo}   DB.rank(code) -> number|null
     DB.on(fn)          -> calls fn() whenever any player changes (realtime listener)
   (Firebase Firestore or Supabase Realtime both fit this shape.) */
var DemoDB=(function(){
  var NAMES=['Falcon','Blaze','Nova','Turbo','Ghost','Rocket','Viper','Storm','Echo','Titan','Comet','Rogue'];
  var P={},subs=[];
  for(var i=0;i<24;i++){var c='HH-'+('00'+(i+1)).slice(-3);P[c]={code:c,nick:NAMES[i%12]+(i>11?' II':''),team:i%2?'WiSoo':'MaZoo',barhams:60+((i*37)%140),aura:120+((i*83)%760),tx:[{t:'Welcome bonus',d:50,ts:Date.now()-36e5}]}}
  P['HH-007'].nick='Player 7';
  var codes=Object.keys(P);
  setInterval(function(){var p=P[codes[Math.floor(Math.random()*codes.length)]],a=[5,10,15,20][Math.floor(Math.random()*4)];
    p.aura+=a;var b=Math.random()<.5?[10,20,5][Math.floor(Math.random()*3)]:0;
    if(b){p.barhams+=b;p.tx.unshift({t:'Station win',d:b,ts:Date.now()})}
    subs.forEach(function(f){f(p.code)})},3500);
  return{demo:true,
    get:function(c){c=(c||'').trim().toUpperCase();return Promise.resolve(P[c]||null)},
    top:function(n){return codes.map(function(c){return P[c]}).sort(function(a,b){return b.aura-a.aura}).slice(0,n)},
    teams:function(){var r={MaZoo:0,WiSoo:0};codes.forEach(function(c){r[P[c].team]+=P[c].aura});return r},
    rounds:function(){return []},event:function(){return null},sched:function(){return Promise.resolve([])},
    board:function(){var m={};codes.forEach(function(c){var q=P[c],k=q.team+'|'+(q.teamName||q.team);m[k]=m[k]||{k:k,c:q.team,n:q.teamName||q.team,p:0};m[k].p=Math.max(m[k].p,q.aura)});return Object.keys(m).map(function(k){return m[k]})},
    rank:function(c){var s=codes.map(function(x){return P[x]}).sort(function(a,b){return b.aura-a.aura});var i=s.findIndex(function(p){return p.code===c});return i<0?null:i+1},
    on:function(f){subs.push(f)},
    }
})();

var FbDB=function(cfg){
  var db,P={},top=[],board=[],rounds=[],ev=null,teams={MaZoo:0,WiSoo:0},subs=[],mine=null,ready;
  firebase.initializeApp(cfg);db=firebase.firestore();
  function ping(c){subs.forEach(function(f){f(c)})}
  var o={demo:false,
    get:function(c){c=(c||'').trim().toUpperCase();if(!/^[A-Z0-9-]{3,12}$/.test(c))return Promise.resolve(null);
      return db.collection('players').doc(c).get().then(function(d){if(!d.exists)return null;P[c]=d.data();
        if(mine!==c){mine=c;db.collection('players').doc(c).onSnapshot(function(s){if(s.exists){P[c]=s.data();ping(c)}})}return P[c]})},
    top:function(n){return top.slice(0,n)},teams:function(){return teams},board:function(){return board},rounds:function(){return rounds},event:function(){return ev},
    sched:function(k){return db.collection('schedule').where('teams','array-contains',k).get().then(function(q){return q.docs.map(function(d){return d.data()})})},
    rank:function(c){var i=top.findIndex(function(p){return p.code===c});return i<0?null:i+1},
    on:function(f){subs.push(f)},
    };
  db.collection('players').orderBy('aura','desc').limit(10).onSnapshot(function(q){top=q.docs.map(function(d){return d.data()});ping()});
  db.collection('meta').doc('leaderboard').onSnapshot(function(d){if(d.exists){board=d.data().teams||[];rounds=d.data().rounds||[];ping()}});
  db.collection('meta').doc('event').onSnapshot(function(d){if(d.exists){ev=d.data();ping()}});
  db.collection('meta').doc('teams').onSnapshot(function(d){if(d.exists){teams={MaZoo:d.data().MaZoo||0,WiSoo:d.data().WiSoo||0};ping()}});
  return o};
var DB=DemoDB;
function loadFirebase(cb){var cfg=window.HH_FIREBASE;if(!cfg||!navigator.onLine){cb();return}
  var V='https://www.gstatic.com/firebasejs/10.14.1/',L=['firebase-app-compat.js','firebase-firestore-compat.js'].concat(window.HH_BAND?['firebase-auth-compat.js']:[]),i=0;
  (function next(){if(i>=L.length){try{DB=FbDB(cfg)}catch(e){DB=DemoDB}cb();return}var s=document.createElement('script');s.src=V+L[i++];s.onload=next;s.onerror=function(){cb()};document.head.appendChild(s)})()}

/* ============ APP ============ */
var LV=[['Rookie',0],['Player',200],['Pro',500],['Legend',1000]];
var EVENT4=new Date('2026-12-04T16:00:00+02:00');
var FORM='https://docs.google.com/forms/d/e/1FAIpQLSdvco3ygC1QWl_FF5PHsXBNhUnm9QDb0ICy5zIFxjpw72dOHA/viewform';
var me=null,tab='barhams',view=document.getElementById('view');
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function lvl(a){var i=0;LV.forEach(function(l,j){if(a>=l[1])i=j});var nx=LV[i+1];return{name:LV[i][0],next:nx?nx[0]:null,pct:nx?Math.round((a-LV[i][1])/(nx[1]-LV[i][1])*100):100,left:nx?nx[1]-a:0}}
function ago(ts){var s=Math.floor((Date.now()-ts)/1000);return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':Math.floor(s/3600)+' h ago'}

function doLogin(c){DB.get(c).then(function(p){if(!p){$('lerr').textContent='Code not found. Check the number on your wristband.';return}store('hh_code',p.code);start(p.code)})}
function start(c){DB.get(c).then(function(p){if(!p){store('hh_code',null);showLogin();return}me=p;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('demonote').textContent=DB.demo?'DEMO MODE: sample players and simulated live scores':'';render()})}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}
function logout(){store('hh_code',null);me=null;showLogin()}



var SCH=null,PLANKEY=null;
function loadPlan(){if(!me||!me.teamName)return;var k=me.team+'|'+me.teamName;if(PLANKEY===k&&SCH)return;PLANKEY=k;DB.sched(k).then(function(r){SCH=r;if(tab==='plan')render()}).catch(function(){})}
function hm(ms){try{return new Date(ms).toLocaleTimeString('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function planHtml(){
  if(!me.teamName)return'<div class="card mut">Your team is not set yet. Ask an organizer.</div>';
  if(!SCH)return'<div class="card mut">Loading your games...</div>';
  var EV=DB.event(),N=17,byR={};SCH.forEach(function(g){byR[g.round]=g});
  if(!SCH.length||!EV)return'<div class="card mut">Your game schedule will appear here before the event starts.</div>';
  var play=EV.play||15,chg=EV.change||5,slot=play+chg,st=Date.parse(EV.start),now=Date.now();
  var board=DB.board(),k=me.team+'|'+me.teamName,mine=board.filter(function(t){return t.k===k})[0],hist={};
  ((mine&&mine.h)||[]).forEach(function(x){hist[x.r]=x});
  function who(r){var g=byR[r];if(!g)return null;var mineA=g.teamA===k;return{st:g.station,opp:mineA?g.nameB:g.nameA,oc:mineA?'WiSoo':'MaZoo'}}
  function line(r){var w=who(r);return w?'Station <b>'+esc(w.st)+'</b> vs '+esc(w.opp):'<b>BREAK</b> &middot; optional games (boxing, hammer, claw)'}
  var mins=(now-st)/60000,idx=Math.floor(mins/slot),r=idx+1,into=mins-idx*slot,h='';
  if(mins<0){h+='<div class="go wait"><div class="k">EVENT STARTS AT '+hm(st)+'</div><div class="b">GET READY</div><div class="d">Round 1 &middot; '+line(1)+'</div></div>'}
  else if(r>N){h+='<div class="go wait"><div class="k">GAMES FINISHED</div><div class="b">WELL PLAYED</div><div class="d">Check the Aura Score tab for the final ranking.</div></div>'}
  else if(into<play){h+='<div class="go play"><div class="k">NOW &middot; ROUND '+r+' OF '+N+'</div><div class="b">'+(who(r)?esc(who(r).st).toUpperCase():'BREAK')+'</div><div class="d">'+(who(r)?'vs '+esc(who(r).opp)+' &middot; ':'Optional games &middot; ')+Math.max(1,Math.ceil(play-into))+' min left</div></div>'
    +(r<N?'<div class="pl"><div class="t">NEXT &middot; ROUND '+(r+1)+' &middot; '+hm(st+r*slot*60000)+'</div><div class="o">'+line(r+1)+'</div></div>':'')}
  else{h+='<div class="go move"><div class="k">MOVE NOW &middot; ROUND '+(r+1>N?'':(r+1)+' STARTS IN '+Math.max(1,Math.ceil(slot-into))+' MIN')+'</div><div class="b">'+(r+1>N?'GAMES FINISHED':(who(r+1)?'GO TO '+esc(who(r+1).st).toUpperCase():'BREAK'))+'</div><div class="d">'+(r+1>N?'':(who(r+1)?'vs '+esc(who(r+1).opp):'Optional games'))+'</div></div>'}
  h+='<h2>YOUR TIMETABLE</h2>';
  for(var i=1;i<=N;i++){var w2=who(i),x=hist[i],cur=mins>=0&&i===r&&into<play;
    h+='<div class="pl'+(cur?' now':'')+(w2?'':' brk')+'">'+(x?'<span class="g">+'+(x.g+x.b)+'</span>':'')+'<div class="t">ROUND '+i+' &middot; '+hm(st+(i-1)*slot*60000)+'</div><div class="s">'+(w2?esc(w2.st):'Break')+'</div><div class="o">'+(w2?'vs '+esc(w2.opp)+' <span class="mut">('+w2.oc+')</span>':'Optional games: boxing, hammer, claw machine')+(x?' &middot; <span class="mut">game +'+x.g+(x.b?', camp bonus +'+x.b:'')+'</span>':'')+'</div></div>'}
  return h}
function roundHistHtml(){var B=DB.board(),k=me.team+'|'+(me.teamName||''),t=B.filter(function(x){return x.k===k})[0],R=DB.rounds(),sum={};R.forEach(function(x){sum[x.r]=x});
  if(!t||!t.h||!t.h.length)return'';
  return'<h2>MY TEAM, ROUND BY ROUND</h2><div class="card">'+t.h.slice().reverse().map(function(x){var q=sum[x.r]||{},line=q.tie?'Tied round: wins swapped, no bonus':(q.w?q.w+' won the round, bonus +'+q.bonus:'');
    return'<div class="row"><div class="nm">Round '+x.r+(x.s?' &middot; '+esc(x.s):' &middot; break')+'<div class="mut">'+esc(line)+'</div></div><div class="v">+'+(x.g+x.b)+'<div class="mut" style="font-size:11px;text-align:right">game '+x.g+' &middot; bonus '+x.b+'</div></div></div>'}).join('')+'</div>'}
function trank(){var B=DB.board();var k=me.team+'|'+(me.teamName||'');var t=B.filter(function(x){return x.k===k})[0];if(!t||!(t.p>0))return null;return 1+B.filter(function(o){return o.p>t.p}).length}
setInterval(function(){if(me&&tab==='plan')render()},20000);
function render(){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  DB.get(me.code).then(function(p){me=p;
    var h='';
    if(tab==='barhams'){
      h+='<div class="card hero"><div class="big" id="bal">'+me.barhams+'</div><small>YOUR BARHAMS</small></div>';
      h+='<h2>RECENT ACTIVITY</h2><div class="card">';
      h+=me.tx.filter(function(t){return String(t.t).indexOf('Round ')!==0}).slice(0,8).map(function(t){return'<div class="row"><div class="nm">'+esc(t.t)+'<div class="mut">'+ago(t.ts)+'</div></div><div class="v '+(t.d>0?'pos':'neg')+'">'+(t.d>0?'+':'')+t.d+'</div></div>'}).join('')+'</div>';
      h+='<div class="card mut">Earn Barhams by winning stations. Spend them at the event shop. Staff tap your wristband to add or deduct.</div>';
    }
    if(tab==='plan'){loadPlan();h+=planHtml()}
    if(tab==='aura'){
      var l=lvl(me.aura),pos=trank(),T=DB.teams(),mz=T.MaZoo,wz=T.WiSoo,list=DB.top(10);
      h+='<div class="card hero"><div class="big">'+me.aura+'</div><small>AURA SCORE &middot; '+l.name.toUpperCase()+(pos?' &middot; TEAM RANK #'+pos:' &middot; KEEP CLIMBING')+'</small>';
      h+='<div class="bar"><i style="width:'+l.pct+'%"></i></div><div class="mut" style="margin-top:6px;color:#fff">'+(l.next?l.left+' to '+l.next:'Top level reached')+'</div></div>';
      h+='<h2>TEAM BATTLE</h2><div class="card vs"><div class="t mz"><b>'+mz+'</b>MaZoo</div><div class="mut">VS</div><div class="t wz"><b>'+wz+'</b>WiSoo</div></div>';
      var B=DB.board().slice().sort(function(x,y){return y.p-x.p||String(x.n).localeCompare(String(y.n))});
      B.forEach(function(t){t.r=1+B.filter(function(o){return o.p>t.p}).length});
      var myK=me.team+'|'+(me.teamName||'');
      h+='<h2>TEAM LEADERBOARD</h2><div class="mut" style="margin-bottom:6px">'+(B.length?B.length+' teams &middot; live':'The ranking starts when the first round is complete.')+'</div>';
      h+=B.map(function(t){var md=t.p>0&&t.r<=3?'<span class="medal '+['g','s','b'][t.r-1]+'">'+t.r+'</span>':'#'+t.r;
        return'<div class="lb '+(t.c==='MaZoo'?'m':'w')+(t.k===myK?' me':'')+'"><div class="r">'+md+'</div><div class="nm">'+esc(t.n)+'<div class="c">'+esc(t.c).toUpperCase()+(t.k===myK?' &middot; YOUR TEAM':'')+'</div></div><div class="v">'+t.p+'</div></div>'}).join('');
      h+=roundHistHtml();
    }
    if(tab==='events'){
      h+='<div class="card hero"><small style="margin:0 0 6px">NEXT EVENT</small><h2 style="margin:0;font-size:30px">BARHOUMATIC EVENT IV</h2><div class="mut" style="color:#fff">El-Le’ba (The Game) &middot; 4 Dec 2026 &middot; Club 7, Maadi</div><div class="cd" id="cd"></div><a class="btn" target="_blank" rel="noopener" href="'+FORM+'">Register for Barhoumatic Event IV</a></div>';
      h+='<h2>PAST EVENTS</h2><div class="card">'+[['Barhoumatic Iftar III','Ramadan 2026'],['Event III: Squid Game','Dec 2025'],['Barhoumatic Iftar II','Ramadan 2025'],['Barhoumatic Event II','Dec 2024'],['Barhoumatic Iftar I','Ramadan 2024'],['Barhoumatic Event I','Dec 2023']].map(function(e){return'<div class="row"><div class="nm">'+e[0]+'</div><div class="mut">'+e[1]+'</div></div>'}).join('')+'</div>';
      h+='<a class="btn alt" href="/#portfolio">Watch event videos</a>';
    }
    if(tab==='profile'){
      var pos2=trank();
      var B=[['First tap',true],['100 Barhams',me.barhams>=100],['Level: Player',me.aura>=200],['Level: Pro',me.aura>=500],['Top 10 team',!!pos2&&pos2<=10],['Legend',me.aura>=1000]];
      h+='<div class="card"><div class="mut">PLAYER</div><div class="row"><div class="nm">Name</div><div class="v">'+esc(me.nick)+'</div></div><div class="row"><div class="nm">Team</div><div class="v">'+me.team+'</div></div><div class="row"><div class="nm">Wristband</div><div class="v">'+me.code+'</div></div></div>';
      h+='<h2>BADGES</h2><div class="card"><div class="badges">'+B.map(function(b){return'<div class="badge'+(b[1]?'':' lock')+'">'+(b[1]?'&#9989; ':'&#128274; ')+b[0]+'</div>'}).join('')+'</div></div>';
      h+='<div class="card mut">Privacy: your wristband stores only a code. Your player name, Barhams and Aura Score are shown to other players. Only the organizers can change your name.</div>';
      h+='<button class="btn alt" onclick="logout()">Log out</button>';
    }
    view.innerHTML=h;
    if(tab==='events')tickCd();
  });
}
function tickCd(){var el=$('cd');if(!el||tab!=='events')return;var d=Math.max(0,EVENT4-Date.now()),s=Math.floor(d/1000);
  el.innerHTML=[['DAYS',Math.floor(s/86400)],['HRS',Math.floor(s%86400/3600)],['MIN',Math.floor(s%3600/60)],['SEC',s%60]].map(function(x){return'<div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('');setTimeout(tickCd,1000)}

document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render();scrollTo(0,0)}});
var pend=null;DB.on(function(code){if(!me||document.activeElement&&document.activeElement.tagName==='INPUT')return;clearTimeout(pend);pend=setTimeout(function(){if(tab==='events'||tab==='profile'&&code!==me.code)return;render()},400)});

/* A signed-in staff member tapping a band goes straight to the organizer view of that player */
function staffRedirect(code,next){
  if(!code||!window.firebase||!firebase.auth||!window.HH_FIREBASE){next();return}
  var done=false;function go(){if(!done){done=true;next()}}
  setTimeout(go,3000);
  try{var un=firebase.auth().onAuthStateChanged(function(u){un();
    if(!u){go();return}
    firebase.firestore().collection('staff').doc(u.uid).get().then(function(d){
      if(d.exists&&!done){done=true;location.replace('organizer.html?c='+encodeURIComponent(code.toUpperCase()))}else go()}).catch(go)})}
  catch(e){go()}}
/* start: wristband tap opens /app/?w=M001 */
(function(){var q=null;try{q=new URLSearchParams(location.search).get('w')}catch(e){}
  var c=q||store('hh_code');window.HH_BAND=q;
  if(q){try{history.replaceState(null,'',location.pathname)}catch(e){}}
  loadFirebase(function(){staffRedirect(q,function(){if(c)start(c.toUpperCase());else showLogin()})});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})})();
</script>
